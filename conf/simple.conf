
server {
    listen 8088;
    root www/;
    index index.html;
    error_page 404 /errors/404.html;

    location / {
        limit_except GET POST;
        autoindex off;
    }
}

#[Block] server (args: )
#  |-- [Directive] listen (args: 8088)
#  |-- [Directive] root (args: /home/jucoelho/Juju_Cadete/Webserv/42-web-server/www)
#  |-- [Directive] index (args: index.html)
#  |
#  |-- [Block] location (args: /)
#        |-- [Directive] allowed_methods (args: GET, POST)
#        |-- [Directive] autoindex (args: off)