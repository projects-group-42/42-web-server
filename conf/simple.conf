  |-- [Directive] root (args: /home/jucoelho/Juju_Cadete/Webserv/42-web-server/www)
  |-- [Directive] index (args: index.html)
  |
  |-- [Block] location (args: /)
        |-- [Directive] allowed_methods (args: GET, POST)
        |-- [Directive] autoindex (args: off)