server {
    listen 127.0.0.1:8081;
    server_name localhost;
    client_max_body_size 200M;

    location / {
        root eval_tests/YoupiBanane;
        index youpi.bad_extension;
        limit_except GET POST;
        autoindex off;
        cgi_pass .bla eval_tests/cgi_tester;
    }

    location /post_body {
        limit_except POST;
        client_max_body_size 100;
        autoindex off;
        upload_store uploads;
    }

    location /directory {
        return 301 /directory/;
    }

    location /directory/ {
        root eval_tests/YoupiBanane;
        index youpi.bad_extension;
        limit_except GET POST;
        autoindex off;
        cgi_pass .bla eval_tests/cgi_tester;
    }
}